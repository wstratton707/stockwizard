# QuantWizard Streamlit configuration
# The theme block aligns Streamlit's built-in widget accents (sliders,
# checkboxes, radios, progress bars, primary buttons) with the brand palette.
# Without this, Streamlit defaults primaryColor to its signature coral red
# (#FF4B4B), which clashed with the blue brand and made download buttons look
# like error states. Colors mirror the design tokens in styles.css.

[theme]
base = "light"
primaryColor = "#1d4ed8"            # brand blue (--accent)
backgroundColor = "#ffffff"         # app canvas (--bg) — white paper, not grey
secondaryBackgroundColor = "#f6f8fb" # bands / code / dataframes (--surface2)
textColor = "#0f172a"               # primary text (--text)
font = "sans serif"

[client]
# Hide the developer toolbar (Deploy button, rerun menu) for a production look.
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
# Serve ./static over HTTP at /app/static/<file>. The report-preview carousel used
# to base64-inline its four screenshots, which pushed ~1.9 MB through the
# websocket on every single Home render — uncached, and 93% of the page's DOM.
# As static files the browser caches them and they load off the critical path.
enableStaticServing = true
